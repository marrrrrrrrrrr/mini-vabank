<header class="header">
  <a class="logo" routerLink="/">
    <img src="/logo.png" alt="Bank of Georgia" />
    <div class="logo-text">
      <span class="logo-ka">საქართველოს ბანკი</span>
      <span class="logo-en">BANK OF GEORGIA</span>
    </div>
  </a>

  <div class="header-right">
    <input class="search" type="text" placeholder="" />
    <button class="icon-btn">▥</button>
    <button class="icon-btn">✉</button>
    <button class="icon-btn">🔔</button>
    <button class="icon-btn">☰</button>
    <button class="icon-btn" (click)="logout()">👤</button>
  </div>
</header>
